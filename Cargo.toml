[package]
name = "simple-config-provider"
version = "2.0.0"
edition = "2024"
rust-version = "1.95"
description = "A small scripted JSON, YAML and TOML configuration provider"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
json5 = "1.3"
yaml_serde = "0.10.7"
toml = { version = "1.1.8", features = ["preserve_order"] }
regress = "0.12"
relative-path = "2"
url = "2"
percent-encoding = "2"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rquickjs = { version = "0.14.0", features = ["loader", "futures", "macro"] }
rquickjs-serde = "0.8.0"
llrt_core = { git = "https://github.com/awslabs/llrt", rev = "f08cdfa648ec9df4bd74e952af832cd6c4ad7e65", default-features = false, features = ["tls-ring", "crypto-ring", "no-sdk"] }
byte-unit = { version = "5.2.6", features = ["serde"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
